<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Vorcaro</title>
  </head>
  <body>
    <header>
      <img class="logo" src="assets/bancofacil_logo.png" />
      <nav>
          <a>Para você</a>
          <a>Daniel Vorcaro</a>
          <a>Investimentos</a>
          <a>Serviços</a>
          <a>Ajuda</a>
      </nav>
      <div class="login">
        <a>Entrar</a>
        <button class="bt-conta">Abrir Conta</button>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="hero-content">
          <h3>Noubank</h3>
          <h1>Seu banco completo, simples e seguro <br> (ou quase).</h1>
          <h4>Seu dinheiro guardado com segurança… até alguém descobrir a senha.</h4>
          <div class="hero-botoes">
            <button class="bt-hero">Abrir minha conta</button>
            <a class="services-hero">Conheça os serviços →</a>
          </div>
        </div>
        <div class="hero-midia">
          <img src="assets/bancofacil_phone.png">
        </div>
      </section>
    </main>
  </body>
</html>
